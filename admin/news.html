<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>News — UZBEKISTAN Gateway Admin</title>
<link rel="stylesheet" href="../assets/site.css"/>
<link rel="stylesheet" href="../assets/admin.css"/>
</head>
<body class="admin-body">
<div class="admin">
  <div id="admin-side"></div>
  <main class="amain">
    <div id="admin-top" data-title="News"></div>
    <div class="acontent" data-screen-label="Admin news">

      <div class="toolbar">
        <div><h2 style="font-size:1.4rem">News &amp; updates</h2><p class="muted" style="font-size:.9rem">128 articles · editorial workflow &amp; scheduling</p></div>
        <div class="grow"></div>
        <button class="btn btn-ghost btn-sm"><span id="i1"></span> Filter</button>
        <button class="btn btn-ghost btn-sm"><span id="i2"></span> Categories</button>
        <button class="btn btn-primary btn-sm"><span id="i3"></span> Write article</button>
      </div>

      <div class="atabs" data-group="a">
        <button class="on" data-tab="all">All <span class="count" style="margin:0">128</span></button>
        <button data-tab="intl">Published</button>
        <button data-tab="domestic">Scheduled</button>
        <button data-tab="draft">Drafts</button>
      </div>

      <div class="toolbar">
        <div class="atop-search" style="display:flex;flex:1;max-width:340px"><span id="i4"></span><input placeholder="Search airports…"/></div>
        <span class="muted" style="font-size:.84rem">Bulk:</span>
        <button class="btn btn-ghost btn-sm">Publish</button>
        <button class="btn btn-ghost btn-sm">Export</button>
      </div>

      <div class="tbl-wrap">
        <table class="table">
          <thead><tr><th style="width:32px"><input type="checkbox"/></th><th>Article</th><th class="hide-sm">Category</th><th class="hide-sm">Author</th><th>Status</th><th class="hide-sm">Translations</th><th class="hide-sm">Date</th><th style="width:80px"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="tbl-foot"><span>Showing 1–8 of 128</span><div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button></div></div>
      </div>

    </div>
  </main>
</div>
<script src="../assets/admin.js"></script>
<script>
ADMIN.mount('news');
const set=(id,s)=>{const e=document.getElementById(id);if(e)e.innerHTML=s;};
set('i1',AI.filter);set('i2',AI.ext);set('i3',AI.plus);set('i4',AI.search);
const data=[
  ['u9','Tashkent unveils expanded terminal','Aviation','Dilnoza K.','pub','Published','EN UZ RU','Jun 2'],
  ['u3','Visa-free travel extended to 90 countries','Tourism','Rustam T.','pub','Published','EN UZ RU','May 28'],
  ['u8','Restoration completes at Shah-i-Zinda','Heritage','Malika S.','pub','Published','EN UZ','May 21'],
  ['u2','New high-speed link Tashkent–Bukhara','Rail','Javlon B.','sched','Scheduled','EN UZ','Jun 10'],
  ['u9','National carrier adds European routes','Aviation','Dilnoza K.','review','In review','EN','May 9'],
  ['u6','Record year for inbound tourism','Tourism','Rustam T.','pub','Published','EN UZ','May 3'],
  ['u3','Chimgan opens new eco-trails','Nature','Malika S.','draft','Draft','EN','Apr 4'],
  ['u1','Bukhara launches night museum','Tourism','Javlon B.','draft','Draft','EN','Mar 30']
];
function langdots(s){const all=['EN','UZ','RU'];return '<span class="langdots">'+all.map(l=>`<span class="${s.includes(l)?'done':'miss'}">${l}</span>`).join('')+'</span>';}
document.getElementById('rows').innerHTML=data.map(d=>`
  <tr>
    <td><input type="checkbox"/></td>
    <td><div class="rowtitle"><img class="thumb" src="../assets/img/${d[0]}.jpg" alt=""/><div><b>${d[1]}</b><small>/news/${d[1].toLowerCase().replace(/[^a-z]+/g,'-').slice(0,28)}</small></div></div></td>
    <td class="hide-sm"><span class="badge badge-teal">${d[2]}</span></td>
    <td class="hide-sm">${d[3]}</td>
    <td><span class="pill ${d[4]}">${d[5]}</span></td>
    <td class="hide-sm">${langdots(d[6])}</td>
    <td class="hide-sm muted">${d[7]}</td>
    <td><div class="row gap-s"><a href="../news-article.html" class="iconbtn" title="View">${AI.ext}</a><button class="iconbtn" title="Edit">${AI.edit}</button><button class="iconbtn" title="More">${AI.dots}</button></div></td>
  </tr>`).join('');
</script>
</body>
</html>
