<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attractions — UZBEKISTAN Gateway Admin</title>
<link rel="stylesheet" href="../assets/site.css"/>
<link rel="stylesheet" href="../assets/admin.css"/>
</head>
<body class="admin-body">
<div class="admin">
  <div id="admin-side"></div>
  <main class="amain">
    <div id="admin-top" data-title="Attractions"></div>
    <div class="acontent" data-screen-label="Admin attractions">

      <div class="toolbar">
        <div><h2 style="font-size:1.4rem">Attractions &amp; monuments</h2><p class="muted" style="font-size:.9rem">214 monument entities linked to cities &amp; heritage</p></div>
        <div class="grow"></div>
        <button class="btn btn-ghost btn-sm"><span id="i1"></span> Filter</button>
        <button class="btn btn-ghost btn-sm"><span id="i2"></span> Import</button>
        <button class="btn btn-primary btn-sm"><span id="i3"></span> Add attraction</button>
      </div>

      <div class="atabs" data-group="a">
        <button class="on" data-tab="all">All <span class="count" style="margin:0">214</span></button>
        <button data-tab="intl">Featured</button>
        <button data-tab="domestic">UNESCO</button>
        <button data-tab="draft">Drafts</button>
      </div>

      <div class="toolbar">
        <div class="atop-search" style="display:flex;flex:1;max-width:340px"><span id="i4"></span><input placeholder="Search airports…"/></div>
        <span class="muted" style="font-size:.84rem">Bulk:</span>
        <button class="btn btn-ghost btn-sm">Publish</button>
        <button class="btn btn-ghost btn-sm">Export</button>
      </div>

      <div class="tbl-wrap">
        <table class="table">
          <thead><tr><th style="width:32px"><input type="checkbox"/></th><th>Attraction</th><th class="hide-sm">City</th><th class="hide-sm">Type</th><th>Status</th><th class="hide-sm">Translations</th><th class="hide-sm">Updated</th><th style="width:80px"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="tbl-foot"><span>Showing 1–8 of 214</span><div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button></div></div>
      </div>

    </div>
  </main>
</div>
<script src="../assets/admin.js"></script>
<script>
ADMIN.mount('attractions');
const set=(id,s)=>{const e=document.getElementById(id);if(e)e.innerHTML=s;};
set('i1',AI.filter);set('i2',AI.ext);set('i3',AI.plus);set('i4',AI.search);
const data=[
  ['u7','Registan Square','Samarkand','Madrasah','pub','Published','EN UZ RU','3h ago','registan'],
  ['u5','Itchan Kala','Khiva','Walled city','pub','Published','EN UZ RU','1d ago','itchan-kala'],
  ['u4','Shah-i-Zinda','Samarkand','Necropolis','pub','Published','EN UZ','2d ago','registan'],
  ['u1','Po-i-Kalyan','Bukhara','Ensemble','pub','Published','EN UZ','3d ago','registan'],
  ['u8','Gur-e-Amir','Samarkand','Mausoleum','review','In review','EN UZ','5d ago','registan'],
  ['u1','Bibi-Khanym','Samarkand','Mosque','pub','Published','EN','6d ago','registan'],
  ['u6','Chorsu Bazaar','Tashkent','Market','draft','Draft','EN','1w ago','registan'],
  ['u8','Ak-Saray Palace','Shakhrisabz','Palace','draft','Draft','EN','2w ago','registan']
];
function langdots(s){const all=['EN','UZ','RU'];return '<span class="langdots">'+all.map(l=>`<span class="${s.includes(l)?'done':'miss'}">${l}</span>`).join('')+'</span>';}
document.getElementById('rows').innerHTML=data.map(d=>`
  <tr>
    <td><input type="checkbox"/></td>
    <td><div class="rowtitle"><img class="thumb" src="../assets/img/${d[0]}.jpg" alt=""/><div><b>${d[1]}</b><small>/attractions/${d[1].toLowerCase().replace(/[^a-z]+/g,'-')}</small></div></div></td>
    <td class="hide-sm">${d[2]}</td>
    <td class="hide-sm">${d[3]}</td>
    <td><span class="pill ${d[4]}">${d[5]}</span></td>
    <td class="hide-sm">${langdots(d[6])}</td>
    <td class="hide-sm muted">${d[7]}</td>
    <td><div class="row gap-s"><a href="../attraction-${d[8]}.html" class="iconbtn" title="View">${AI.ext}</a><button class="iconbtn" title="Edit">${AI.edit}</button><button class="iconbtn" title="More">${AI.dots}</button></div></td>
  </tr>`).join('');
</script>
</body>
</html>
