<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Airports — UZBEKISTAN Gateway Admin</title>
<link rel="stylesheet" href="../assets/site.css"/>
<link rel="stylesheet" href="../assets/admin.css"/>
</head>
<body class="admin-body">
<div class="admin">
  <div id="admin-side"></div>
  <main class="amain">
    <div id="admin-top" data-title="Airports"></div>
    <div class="acontent" data-screen-label="Admin airports">

      <div class="toolbar">
        <div><h2 style="font-size:1.4rem">Airports</h2><p class="muted" style="font-size:.9rem">11 airport entities · live flight feeds &amp; terminal data</p></div>
        <div class="grow"></div>
        <button class="btn btn-ghost btn-sm"><span id="i1"></span> Filter</button>
        <button class="btn btn-ghost btn-sm"><span id="i2"></span> Import</button>
        <button class="btn btn-primary btn-sm"><span id="i3"></span> Add airport</button>
      </div>

      <div class="atabs" data-group="a">
        <button class="on" data-tab="all">All <span class="count" style="margin:0">11</span></button>
        <button data-tab="intl">International</button>
        <button data-tab="domestic">Domestic</button>
        <button data-tab="draft">Drafts</button>
      </div>

      <div class="toolbar">
        <div class="atop-search" style="display:flex;flex:1;max-width:340px"><span id="i4"></span><input placeholder="Search airports…"/></div>
        <span class="muted" style="font-size:.84rem">Bulk:</span>
        <button class="btn btn-ghost btn-sm">Publish</button>
        <button class="btn btn-ghost btn-sm">Export</button>
      </div>

      <div class="tbl-wrap">
        <table class="table">
          <thead><tr><th style="width:32px"><input type="checkbox"/></th><th>Airport</th><th class="hide-sm">IATA</th><th class="hide-sm">City</th><th>Status</th><th class="hide-sm">Translations</th><th class="hide-sm">Updated</th><th style="width:80px"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="tbl-foot"><span>Showing 1–8 of 11</span><div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>›</button></div></div>
      </div>

    </div>
  </main>
</div>
<script src="../assets/admin.js"></script>
<script>
ADMIN.mount('airports');
const set=(id,s)=>{const e=document.getElementById(id);if(e)e.innerHTML=s;};
set('i1',AI.filter);set('i2',AI.ext);set('i3',AI.plus);set('i4',AI.search);
const data=[
  ['u9','Tashkent Islam Karimov Int’l','TAS','Tashkent','pub','Published','EN UZ RU','2h ago'],
  ['u8','Samarkand Int’l','SKD','Samarkand','pub','Published','EN UZ RU','1d ago'],
  ['u1','Bukhara Int’l','BHK','Bukhara','pub','Published','EN UZ','3d ago'],
  ['u5','Urgench Int’l','UGC','Urgench','pub','Published','EN UZ RU','4d ago'],
  ['u3','Namangan Int’l','NMA','Namangan','review','In review','EN UZ','6d ago'],
  ['u6','Nukus Int’l','NCU','Nukus','pub','Published','EN UZ','1w ago'],
  ['u3','Fergana','FEG','Fergana','draft','Draft','EN','2w ago'],
  ['u6','Termez Int’l','TMJ','Termez','draft','Draft','EN','3w ago']
];
function langdots(s){const all=['EN','UZ','RU'];return '<span class="langdots">'+all.map(l=>`<span class="${s.includes(l)?'done':'miss'}">${l}</span>`).join('')+'</span>';}
document.getElementById('rows').innerHTML=data.map(d=>`
  <tr>
    <td><input type="checkbox"/></td>
    <td><div class="rowtitle"><img class="thumb" src="../assets/img/${d[0]}.jpg" alt=""/><div><b>${d[1]}</b><small>ICAO · ${d[2]==='TAS'?'UTTT':d[2]==='SKD'?'UTSS':'UT··'}</small></div></div></td>
    <td class="hide-sm mono">${d[2]}</td>
    <td class="hide-sm">${d[3]}</td>
    <td><span class="pill ${d[4]}">${d[5]}</span></td>
    <td class="hide-sm">${langdots(d[6])}</td>
    <td class="hide-sm muted">${d[7]}</td>
    <td><div class="row gap-s"><a href="../airport-${d[2]==='TAS'?'tashkent':d[2]==='SKD'?'samarkand':'tashkent'}.html" class="iconbtn" title="View">${AI.ext}</a><button class="iconbtn" title="Edit">${AI.edit}</button><button class="iconbtn" title="More">${AI.dots}</button></div></td>
  </tr>`).join('');
</script>
</body>
</html>
