<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audit Logs — UZBEKISTAN Gateway Admin</title>
<link rel="stylesheet" href="../assets/site.css"/>
<link rel="stylesheet" href="../assets/admin.css"/>
<style>
.act{font-family:var(--font-mono);font-size:.7rem;font-weight:700;padding:.2rem .5rem;border-radius:6px}
.act.create{background:oklch(0.56 0.10 155/.14);color:var(--positive)}
.act.update{background:var(--primary-soft);color:var(--primary-strong)}
.act.delete{background:oklch(0.55 0.16 25/.14);color:var(--danger)}
.act.publish{background:var(--gold-soft);color:var(--gold-strong)}
.act.login{background:var(--surface-3);color:var(--text-faint)}
</style>
</head>
<body class="admin-body">
<div class="admin">
  <div id="admin-side"></div>
  <main class="amain">
    <div id="admin-top" data-title="Audit Logs"></div>
    <div class="acontent" data-screen-label="Admin audit logs">

      <div class="toolbar">
        <div><h2 style="font-size:1.4rem">Audit logs</h2><p class="muted" style="font-size:.9rem">Immutable record of every change across the platform</p></div>
        <div class="grow"></div>
        <button class="btn btn-ghost btn-sm"><span id="i1"></span> Filter</button>
        <button class="btn btn-ghost btn-sm"><span id="i2"></span> Export CSV</button>
      </div>

      <div class="toolbar">
        <div class="atop-search" style="display:flex;flex:1;max-width:320px"><span id="i3"></span><input placeholder="Search by user, entity or action…"/></div>
        <button class="chip on">All actions</button><button class="chip">Create</button><button class="chip">Update</button><button class="chip">Publish</button><button class="chip">Delete</button>
      </div>

      <div class="tbl-wrap">
        <table class="table">
          <thead><tr><th>Action</th><th>User</th><th class="hide-sm">Entity</th><th class="hide-sm">IP</th><th style="text-align:right">Time</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="tbl-foot"><span>Showing 12 of 8,420 events</span><div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button></div></div>
      </div>

    </div>
  </main>
</div>
<script src="../assets/admin.js"></script>
<script>
ADMIN.mount('audit');
const set=(id,s)=>{const e=document.getElementById(id);if(e)e.innerHTML=s;};
set('i1',AI.filter);set('i2',AI.ext);set('i3',AI.search);
const logs=[
  ['publish','Dilnoza K.','News · "Tashkent unveils terminal"','10.4.2.18','2m ago'],
  ['update','Rustam T.','City · Samarkand (RU translation)','10.4.2.31','18m ago'],
  ['create','Aziza K.','Affiliate offer · flydubai','10.4.2.5','1h ago'],
  ['update','Malika S.','Media · 12 assets alt-text','10.4.2.44','3h ago'],
  ['publish','Javlon B.','Guide · scheduled "Silk Road 10d"','10.4.2.27','5h ago'],
  ['login','Aziza K.','Session started','10.4.2.5','5h ago'],
  ['delete','Rustam T.','Attraction draft · "Old test"','10.4.2.31','1d ago'],
  ['update','Otabek F.','Partner · Hyatt Regency plan','10.4.2.60','1d ago'],
  ['create','Malika S.','Translation · UZ strings (14)','10.4.2.44','1d ago'],
  ['update','Aziza K.','Settings · default theme','10.4.2.5','2d ago'],
  ['publish','Dilnoza K.','City · Khiva','10.4.2.18','2d ago'],
  ['login','Javlon B.','Session started','10.4.2.27','2d ago']
];
document.getElementById('rows').innerHTML=logs.map(l=>`
  <tr>
    <td><span class="act ${l[0]}">${l[0].toUpperCase()}</span></td>
    <td><div class="rowtitle"><div class="avatar" style="width:28px;height:28px;font-size:.66rem">${l[1].split(' ').map(x=>x[0]).join('')}</div><b style="font-size:.86rem">${l[1]}</b></div></td>
    <td class="hide-sm muted">${l[2]}</td>
    <td class="hide-sm mono muted" style="font-size:.78rem">${l[3]}</td>
    <td class="muted" style="text-align:right">${l[4]}</td>
  </tr>`).join('');
</script>
</body>
</html>
